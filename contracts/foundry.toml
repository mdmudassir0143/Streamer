[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[rpc_endpoints]
hsk_testnet = "https://testnet.hsk.xyz"
hsk_mainnet = "https://mainnet.hsk.xyz"
local = "http://127.0.0.1:8545"

[lint]
lint_on_build = false
